# Questions the docs answer. Pass = correct key term + a verified citation to the right page.
- id: cors-react-frontend
  category: answerable
  turns:
    - user_says: My React app on localhost:3000 can't call my FastAPI backend, the browser blocks it. How do I fix that?
  expect:
    tools_called: [search_docs]
    answer_contains_any: [CORSMiddleware]
    cites_url_contains_any: [tutorial/cors]
    verified: true
    approvals: 0

